[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fibsem"
version = "0.4.1a1"

description = "a universal api for fibsem control"
authors = [
    {name = "Patrick Cleeve", email = "patrick@openfibsem.org"},
]
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3.8",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: napari",
]

dependencies = [
    "tifffile>=2025.5.10",
    "numpy>=1.23.5",
    "scipy>=1.15.3",
    "opencv-python-headless>=4.11.0.86",
    "scikit-image>=0.25.2",
    "tqdm>=4.67.1",
    "petname>=2.6",
    "pandas>=2.3.0",
    "pyyaml>=6.0.2",
    "psygnal>=0.13.0",
    "ome_types>=0.3.4",
    "lxml>=4.8.0",
]

[project.urls]
Homepage = "https://github.com/DeMarcoLab/fibsem"
"Bug Tracker" = "https://github.com/DeMarcoLab/fibsem/issues"

[project.optional-dependencies]
ml = [
    "zarr>=2.13.6",
    "dask>=2023.3.0",
    "torch>=2.0.0,<=2.1.2",
    "torchvision>=0.15.1",
    "segmentation-models-pytorch>=0.3.2",
    "plotly>=5.14.1",
    "kaleido==0.2.0",
    "transformers>=4.36.2",
]
ui = [
    "napari>=0.4.17,<=0.5.3",
    "pyqt5>=5.15.9",
    "matplotlib_scalebar>=0.8.1",
]
odemis = [
    "pylibtiff>=0.4.4"
]

reporting = [
    "plotly>=5.14.1",
    "reportlab",
    "kaleido==0.2.0"
]

[project.scripts]
fibsem_ui = "fibsem.ui.FibsemUI:main"
fibsem_label = "fibsem.ui.FibsemLabellingUI:main"
fibsem-generate-config = "fibsem.configuration:gen_config_cli"
fibsem-config-ui = "fibsem.ui.FibsemMicroscopeConfigurationWidget:main"
